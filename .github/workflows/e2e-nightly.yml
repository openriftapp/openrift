name: E2E Nightly

# Playwright against a production build of the web app. Runs on a schedule and
# by hand only; it never deploys and needs no secrets.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

env:
  DO_NOT_TRACK: 1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DATABASE_URL: postgres://openrift:e2e-ci-password@localhost:5432/openrift
      E2E_WEB_MODE: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # docker-compose.yml reads the database credentials from .env. Throwaway
      # values only: the database lives and dies with this runner.
      - name: Write .env for the database container
        run: |
          {
            echo "POSTGRES_DB=openrift"
            echo "POSTGRES_USER=openrift"
            echo "POSTGRES_PASSWORD=e2e-ci-password"
          } > .env

      # The db service runs as $UID on a bind mount, so the directory must
      # exist and belong to the runner user before Postgres initializes it.
      - name: Start Postgres
        run: |
          mkdir -p data/postgres
          env UID="$(id -u)" GID="$(id -g)" docker compose up -d --wait db

      - name: Build
        run: bun run build
        env:
          E2E_READABLE_SERVER_FN_IDS: "1"

      - name: Install Chromium
        working-directory: packages/e2e
        run: bunx playwright install --with-deps chromium

      # global-setup creates a temporary database, migrates it, loads
      # apps/api/src/test/fixtures/seed.sql and starts the API, the built web
      # server and scripts/local-proxy.ts.
      - name: Run Playwright
        working-directory: packages/e2e
        run: bunx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 14

      - name: Postgres logs
        if: failure()
        run: docker compose logs db
