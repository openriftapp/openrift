<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenRift</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="popup">
    <header class="app-bar">
      <img class="app-logo" src="/logo-color.svg" alt="" width="20" height="20" />
      <span class="app-name">OpenRift</span>
      <button id="options" type="button" class="icon" aria-label="Extension options">
        <svg
          viewBox="0 0 24 24"
          width="15"
          height="15"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 7h-9" />
          <path d="M14 17H5" />
          <circle cx="17" cy="17" r="3" />
          <circle cx="7" cy="7" r="3" />
        </svg>
      </button>
    </header>

    <section class="section">
      <h2 class="section-title">Cardmarket</h2>
      <p id="sync-empty" class="lead" hidden>No lists synchronized yet.</p>
      <p id="sync-lead" class="lead" hidden>Synchronized lists</p>
      <ul id="sync-lists" class="lists" hidden></ul>
      <p id="last-sync" class="last-sync" hidden></p>
      <p id="permission-note" class="note" hidden>
        Allow OpenRift to run on its own and counts stay current without opening this.
      </p>
      <div class="row">
        <button id="primary" type="button" class="primary">Synchronize</button>
        <button id="sync" type="button" hidden>Synchronize</button>
        <button id="enable" type="button" hidden>Run automatically</button>
      </div>
    </section>

    <section id="picks" class="section" hidden>
      <h2 class="section-title">Picked for a list</h2>
      <div id="picks-list"></div>
    </section>

    <section id="deck" class="section" hidden>
      <h2 class="section-title">Deck Import</h2>
      <p id="deck-detail" class="lead"></p>
      <div class="row">
        <button id="import" type="button" class="primary">Import deck</button>
      </div>
    </section>

    <p id="result" class="result" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
